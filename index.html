<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9efdf">
  <title>화랑과 함께하는 각궁 만들기</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js는 CDN에서 불러옵니다. 인터넷 연결이 필요합니다. -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script defer src="game-state.js"></script>
  <script defer src="scene.js"></script>
  <script defer src="bending.js"></script>
  <script defer src="woodwork.js"></script>
  <script defer src="assembly.js"></script>
  <script defer src="glue.js"></script>
  <script defer src="winding.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <main class="app">
    <section class="world" aria-label="화랑과 전통 공방의 3D 무대">
      <div id="scene-container" class="scene-container"></div>
      <div class="speech" id="speech"><span>꼬마 화랑의 한마디</span><strong>각궁을 만들러 가자!</strong></div>
    </section>
    <div class="loading-error" id="loading-error" role="alert" hidden>
      3D 화면을 불러오지 못했어요. 게임 파일과 인터넷 연결, 브라우저의 WebGL 지원을 확인한 뒤 새로고침해 주세요.
    </div>

    <section class="intro-panel" id="intro-panel" aria-labelledby="game-title">
      <div class="intro-card">
        <p class="eyebrow"><span aria-hidden="true">✳</span> 슬기로운 전통 공방</p>
        <h1 id="game-title"><span>화랑과 함께하는</span> 각궁 만들기<span class="accent">!</span></h1>
        <p>각궁을 만들며 우리 전통 공예를 체험해요.</p>
        <button id="start-button" class="primary-button" type="button" disabled>게임 시작 <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <section class="stage-panel" id="stage-panel" aria-labelledby="stage-title" hidden>
      <div class="hud-top">
        <div class="hud-header">
          <div class="stage-heading">
            <p class="stage-step" id="stage-step">STEP 01</p>
            <h2 id="stage-title" tabindex="-1">대나무 자르기 · 다듬기</h2>
          </div>
          <div class="hud-header-actions">
            <button id="help-button" class="help-button" type="button" aria-label="도움말 / 규칙 보기" aria-expanded="false" aria-controls="help-panel">?</button>
            <button id="back-button" class="secondary-button back-button" type="button">← 처음으로</button>
          </div>
        </div>
        <aside id="help-panel" class="help-panel" aria-label="도움말과 규칙" hidden>
          <p id="stage-description"></p>
          <p id="stage-rule-text"></p>
          <p id="heat-rules" hidden></p>
          <p id="winding-status" aria-live="polite" hidden></p>
        </aside>
        <div class="stage-progress" aria-label="전체 단계 진척도">
          <div class="stage-progress-item" role="progressbar" aria-label="1단계" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">1</div>
          <div class="stage-progress-item" role="progressbar" aria-label="2단계" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">2</div>
          <div class="stage-progress-item" role="progressbar" aria-label="3단계" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">3</div>
          <div class="stage-progress-item" role="progressbar" aria-label="4단계" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">4</div>
          <div class="stage-progress-item" role="progressbar" aria-label="5단계" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">5</div>
          <div class="stage-progress-item" role="progressbar" aria-label="6단계" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">6</div>
        </div>
        <div id="bending-controls" hidden>
          <div class="heat-info">
            <div class="heat-heading"><strong id="heat-zone">상단 가열</strong><strong id="heat-time">0.0초</strong></div>
            <div id="heat-progress" class="heat-gauge" role="progressbar" aria-label="가열 시간, 성공 구간 8초부터 12초" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0">
              <span class="heat-success-zone"></span><span class="heat-marker"></span>
            </div>
            <p id="heat-status" aria-live="polite"></p>
            <p id="heat-results"></p>
          </div>
        </div>
        <div class="assembly-info" id="assembly-info" hidden>
          <div class="assembly-heading"><strong id="assembly-time">10.0초</strong><strong id="assembly-count">0 / 50회</strong></div>
          <progress id="assembly-progress" max="50" value="0" aria-label="결합 진행도"></progress>
        </div>
        <div class="glue-info" id="glue-info" hidden>
          <div id="glue-progress-label" aria-live="polite">뿔/목재 0% · 조립품 0%</div>
          <progress id="glue-progress" max="100" value="0" aria-label="전체 풀칠 진행도"></progress>
        </div>
        <div class="winding-info" id="winding-info" hidden>
          <div class="assembly-heading"><strong id="winding-percent">0%</strong><strong id="winding-time">60.0초</strong></div>
          <progress id="winding-progress" max="100" value="0" aria-label="밧줄 감기 진행도"></progress>
        </div>
      </div>
      <div id="winding-pad" class="winding-pad" aria-label="원을 따라 드래그하여 밧줄 감기" hidden>
        <span class="winding-pad-label" aria-hidden="true">빙글빙글</span>
      </div>
      <div class="hud-bottom">
        <div id="stage-info" class="stage-info">
          <div id="trim-progress" class="trim-progress" aria-live="polite">외곽선 0% · 정확도 0%</div>
          <div class="rotation-control">
            <label for="rotation-slider"><span id="rotation-name">대나무 회전</span> <output id="rotation-value" for="rotation-slider">0°</output></label>
            <input id="rotation-slider" type="range" min="0" max="360" value="0" step="1" aria-label="대나무 회전 각도">
          </div>
        </div>
        <div class="stage-actions" id="carving-actions">
          <button id="retry-button" class="secondary-button" type="button">다시하기</button>
          <button id="finish-button" class="primary-button" type="button">완료</button>
        </div>
        <div class="stage-actions" id="bending-actions" hidden>
          <button id="bending-retry" class="secondary-button" type="button">다시하기</button>
          <button id="heat-finish" class="primary-button" type="button">가열 완료 / 빼기</button>
          <button id="bending-finish" class="primary-button" type="button" disabled>완료</button>
        </div>
        <div class="stage-actions" id="wood-actions" hidden>
          <button id="wood-retry" class="secondary-button" type="button">다시하기</button>
          <button id="wood-finish" class="primary-button" type="button">완료</button>
        </div>
        <div class="stage-actions" id="assembly-actions" hidden>
          <button id="assembly-retry" class="secondary-button" type="button">다시하기</button>
          <button id="assembly-start" class="primary-button" type="button">시작</button>
        </div>
        <div class="glue-choices" id="glue-choices" role="group" aria-label="접착제 선택" hidden>
          <button type="button" class="glue-choice" data-glue="1"><span class="glue-swatch white"></span>목공풀</button>
          <button type="button" class="glue-choice" data-glue="2"><span class="glue-swatch ochre"></span>천연풀</button>
          <button type="button" class="glue-choice" data-glue="3"><span class="glue-swatch pink"></span>수박 주스</button>
        </div>
        <div class="stage-actions" id="glue-actions" hidden>
          <button id="glue-finish" class="primary-button" type="button" disabled>완료</button>
        </div>
        <div class="stage-actions" id="winding-actions" hidden>
          <button id="winding-retry" class="secondary-button" type="button">다시하기</button>
          <button id="winding-finish" class="primary-button" type="button">완료</button>
        </div>
      </div>
    </section>
    <div id="tutorial-hand" class="tutorial-hand" aria-hidden="true" hidden>
      <svg viewBox="0 0 26 26" width="40" height="40">
        <path d="M11 3a2 2 0 0 1 4 0v8.1a2 2 0 0 1 3.5.8 2 2 0 0 1 3.5 1.2v4.6c0 3.6-2.4 6.3-6.1 6.3h-2.1c-1.5 0-2.9-.6-3.9-1.7L5 17.4a2 2 0 0 1 2.8-2.8L11 17Z" fill="#fffdf6" stroke="#374e40" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </div>
  </main>
  <dialog id="result-dialog" aria-labelledby="result-title" aria-describedby="result-message">
    <div class="result-icon" aria-hidden="true">✦</div>
    <h2 id="result-title"></h2>
    <p id="result-message"></p>
    <button id="result-button" class="primary-button" type="button">확인</button>
  </dialog>
</body>
</html>
