<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대나무 공방 - 3단계 재단</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2ead8;
      --gold: #d7ad6c;
      --panel: rgba(25, 34, 31, .84);
      --line: rgba(232, 214, 174, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17211e;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    button { font: inherit; }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: default;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(13, 20, 18, .83) 0%, rgba(13, 20, 18, .55) 29%, transparent 58%),
        linear-gradient(0deg, rgba(11, 17, 15, .78), transparent 34%, rgba(11, 17, 15, .3));
    }

    #interface {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: 26px;
      left: clamp(24px, 4.2vw, 66px);
      right: clamp(24px, 4.2vw, 66px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 19px;
      line-height: 1;
    }

    .brand-copy { display: grid; gap: 3px; }

    .brand-copy small {
      color: var(--gold);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .22em;
    }

    .brand-copy strong {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .stage-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px 9px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(21, 29, 26, .64);
      color: #e8dfcc;
      font-size: 12px;
      letter-spacing: .04em;
      backdrop-filter: blur(12px);
    }

    .stage-chip b {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 50%;
      background: var(--gold);
      color: #20231c;
      font-family: Georgia, serif;
      font-size: 12px;
    }

    .intro {
      position: absolute;
      top: clamp(145px, 25vh, 220px);
      left: clamp(44px, 7vw, 112px);
      width: min(480px, 40vw);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 19px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    .eyebrow::before {
      width: 24px;
      height: 1px;
      background: var(--gold);
      content: "";
    }

    h1 {
      margin: 0;
      font-family: "Batang", "Nanum Myeongjo", "Malgun Gothic", serif;
      font-size: clamp(34px, 3.5vw, 49px);
      font-weight: 500;
      letter-spacing: -.08em;
      line-height: 1.35;
      text-shadow: 0 3px 24px rgba(0, 0, 0, .35);
    }

    h1 em {
      color: #d9c294;
      font-style: normal;
    }

    #instruction {
      min-height: 48px;
      margin: 18px 0 0;
      color: #c7c7b8;
      font-size: 13px;
      letter-spacing: -.025em;
      line-height: 1.8;
      word-break: keep-all;
    }

    .gesture-note {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 24px;
      color: #a7ad9e;
      font-size: 11px;
      letter-spacing: .015em;
    }

    .cut-icon {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .6);
      border-radius: 50%;
      color: var(--gold);
      font-size: 14px;
    }

    .bottom-area {
      position: absolute;
      right: 24px;
      bottom: 30px;
      left: 24px;
      display: flex;
      justify-content: center;
    }

    .progress-card {
      width: min(520px, 100%);
      padding: 17px 21px 15px;
      border: 1px solid rgba(221, 204, 163, .22);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .28);
      backdrop-filter: blur(16px);
    }

    .progress-head, .progress-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .progress-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #e5dfce;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .progress-mark {
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .45);
      border-radius: 50%;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 11px;
    }

    #cut-count {
      color: #f1d5a5;
      font-family: Georgia, serif;
      font-size: 19px;
    }

    #cut-count small {
      margin-left: 2px;
      color: #b8b5a7;
      font-family: inherit;
      font-size: 11px;
    }

    .progress-track {
      height: 7px;
      margin: 12px 0 10px;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(231, 220, 191, .12);
    }

    #progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #849e6d, #d2ae6b);
      box-shadow: 0 0 14px rgba(212, 174, 105, .35);
      transition: width .3s ease;
    }

    .progress-label {
      color: #aeb3a4;
      font-size: 10px;
      letter-spacing: .02em;
    }

    #progress-state { color: #d4bd8e; }

    #complete-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(10, 16, 14, .38);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s, visibility .3s;
      pointer-events: none;
    }

    #complete-screen.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .complete-card {
      width: min(435px, 100%);
      padding: 36px 34px 30px;
      border: 1px solid rgba(226, 202, 152, .34);
      border-radius: 20px;
      background: rgba(26, 35, 31, .94);
      box-shadow: 0 25px 90px rgba(0, 0, 0, .45);
      text-align: center;
      backdrop-filter: blur(18px);
      transform: translateY(12px) scale(.98);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1);
    }

    #complete-screen.is-visible .complete-card {
      transform: translateY(0) scale(1);
    }

    .complete-seal {
      display: grid;
      width: 51px;
      height: 51px;
      margin: 0 auto 17px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: #ecd09b;
      font-size: 22px;
    }

    .complete-kicker {
      margin: 0 0 9px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    .complete-card h2 {
      margin: 0;
      font-family: "Batang", "Nanum Myeongjo", "Malgun Gothic", serif;
      font-size: 31px;
      font-weight: 500;
      letter-spacing: -.06em;
    }

    .complete-copy {
      margin: 12px 0 25px;
      color: #b8bbae;
      font-size: 12px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .complete-actions {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 9px;
    }

    .action-button {
      min-height: 44px;
      padding: 0 13px;
      border: 1px solid rgba(231, 215, 180, .24);
      border-radius: 9px;
      background: transparent;
      color: #ded8c8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -.02em;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s;
      pointer-events: auto;
    }

    .action-button:hover {
      border-color: rgba(231, 215, 180, .6);
      background: rgba(255, 255, 255, .05);
      transform: translateY(-1px);
    }

    .action-button.primary {
      border-color: #d6ad70;
      background: #d6ad70;
      color: #25271f;
    }

    .action-button.primary:hover {
      border-color: #ebc98e;
      background: #ebc98e;
    }

    #toast {
      position: absolute;
      bottom: 138px;
      left: 50%;
      padding: 10px 15px;
      border: 1px solid rgba(227, 206, 164, .22);
      border-radius: 999px;
      background: rgba(23, 31, 28, .9);
      color: #e4d7bb;
      font-size: 11px;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
    }

    #toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #load-error {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 24px;
      background: #17211e;
      color: #f2ead8;
      text-align: center;
    }

    #load-error.is-visible { display: grid; }
    #load-error p { max-width: 470px; line-height: 1.8; }
  </style>
</head>
<body>
  <div id="scene" aria-label="대나무를 재단하는 3D 작업대"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main id="interface">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">竹</div>
        <div class="brand-copy">
          <small>HANDCRAFT WORKSHOP</small>
          <strong>대나무 공방</strong>
        </div>
      </div>
      <div class="stage-chip"><b>03</b><span>3단계 · 재단</span></div>
    </header>

    <section class="intro" aria-live="polite">
      <p class="eyebrow">STAGE 03 &nbsp; / &nbsp; CUTTING</p>
      <h1>점선을 눌러<br><em>대나무를 재단하세요</em></h1>
      <p id="instruction">대나무 양쪽의 점선을 차례로 클릭하세요.</p>
      <div class="gesture-note">
        <span class="cut-icon" aria-hidden="true">✂</span>
        <span>양쪽 절단선을 모두 클릭하세요</span>
      </div>
    </section>

    <section class="bottom-area" aria-live="polite">
      <div class="progress-card">
        <div class="progress-head">
          <div class="progress-title"><span class="progress-mark" aria-hidden="true">Ⅲ</span><span>대나무 재단</span></div>
          <strong id="cut-count">0<small> / 2</small></strong>
        </div>
        <div class="progress-track" role="progressbar" aria-label="대나무 재단 진행도" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
        <div class="progress-label">
          <span id="progress-hint">좌우 점선을 클릭해 양 끝을 잘라주세요</span>
          <span id="progress-state">재단 준비</span>
        </div>
      </div>
    </section>

    <section id="complete-screen" aria-modal="true" role="dialog" aria-labelledby="complete-title">
      <div class="complete-card">
        <div class="complete-seal" aria-hidden="true">✓</div>
        <p class="complete-kicker">STAGE 03 COMPLETE</p>
        <h2 id="complete-title">3단계 완료</h2>
        <p class="complete-copy">대나무 양쪽을 모두 재단했어요.<br>다음 작업을 준비해보세요.</p>
        <div class="complete-actions">
          <button class="action-button" id="retry-button" type="button">3단계 다시하기</button>
          <button class="action-button primary" id="next-button" type="button">4단계로 넘어가기 <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <div id="load-error" role="alert">
    <p>3D 장면을 불러오지 못했습니다.<br>인터넷 연결을 확인한 뒤 페이지를 새로고침해주세요.</p>
  </div>

  <script type="module">
    const errorScreen = document.getElementById("load-error");
    function announceStageReady() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: "stage-ready", stage: "stage3" }, "*");
      }
    }

    import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js").then((THREE) => {
      (() => {
        "use strict";

        const host = document.getElementById("scene");
        const instruction = document.getElementById("instruction");
        const cutCountLabel = document.getElementById("cut-count");
        const progressFill = document.getElementById("progress-fill");
        const progressTrack = document.querySelector(".progress-track");
        const progressHint = document.getElementById("progress-hint");
        const progressState = document.getElementById("progress-state");
        const completionScreen = document.getElementById("complete-screen");
        const toast = document.getElementById("toast");

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x17211e);
        scene.fog = new THREE.Fog(0x17211e, 17, 32);

        const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 80);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        host.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xe4ddc5, 0x263732, 1.7));

        const keyLight = new THREE.DirectionalLight(0xffd8a0, 3.1);
        keyLight.position.set(-4.5, 9, 6);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        keyLight.shadow.camera.left = -9;
        keyLight.shadow.camera.right = 9;
        keyLight.shadow.camera.top = 9;
        keyLight.shadow.camera.bottom = -8;
        keyLight.shadow.bias = -0.00025;
        scene.add(keyLight);

        const fillLight = new THREE.PointLight(0x8eaa8b, 22, 17, 2);
        fillLight.position.set(-4, 4, -2);
        scene.add(fillLight);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(80, 80),
          new THREE.MeshStandardMaterial({ color: 0x18231f, roughness: 0.96 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.78;
        ground.receiveShadow = true;
        scene.add(ground);

        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(15, 5, 0.24),
          new THREE.MeshStandardMaterial({ color: 0x202c27, roughness: 0.9 })
        );
        wall.position.set(0, 1.72, -4.12);
        wall.receiveShadow = true;
        wall.castShadow = true;
        scene.add(wall);

        const slatMaterial = new THREE.MeshStandardMaterial({ color: 0x2d3931, roughness: 0.8 });
        for (let x = -7; x <= 7; x += 0.72) {
          const slat = new THREE.Mesh(new THREE.BoxGeometry(0.045, 3.7, 0.06), slatMaterial);
          slat.position.set(x, 1.7, -3.96);
          slat.castShadow = true;
          scene.add(slat);
        }

        function addBox(parent, size, material, position) {
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
          mesh.position.set(position[0], position[1], position[2]);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          parent.add(mesh);
          return mesh;
        }

        const workOffset = new THREE.Vector3(0.02, 0, -0.2);
        const table = new THREE.Group();
        table.position.copy(workOffset);
        scene.add(table);
        const plankColors = [0x624a32, 0x705238, 0x664a30, 0x76583b, 0x624831];
        for (let index = 0; index < 5; index += 1) {
          const material = new THREE.MeshStandardMaterial({
            color: plankColors[index],
            roughness: 0.83,
            metalness: 0.02
          });
          addBox(table, [9.7, 0.2, 0.97], material, [0, 0.46, -1.94 + index * 0.97]);
        }

        const tableEdgeMaterial = new THREE.MeshStandardMaterial({ color: 0x493723, roughness: 0.78 });
        addBox(table, [9.84, 0.09, 0.09], tableEdgeMaterial, [0, 0.39, -2.48]);
        addBox(table, [9.84, 0.09, 0.09], tableEdgeMaterial, [0, 0.39, 2.48]);

        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x493723, roughness: 0.84 });
        for (const x of [-4.18, 4.18]) {
          for (const z of [-2.05, 2.05]) {
            addBox(table, [0.23, 1.15, 0.23], legMaterial, [x, -0.115, z]);
          }
        }

        const braceMaterial = new THREE.MeshStandardMaterial({ color: 0x55402b, roughness: 0.85 });
        addBox(table, [8.35, 0.16, 0.2], braceMaterial, [0, -0.25, -2.02]);
        addBox(table, [8.35, 0.16, 0.2], braceMaterial, [0, -0.25, 2.02]);
        addBox(table, [0.19, 0.15, 4.15], braceMaterial, [-3.98, -0.25, 0]);
        addBox(table, [0.19, 0.15, 4.15], braceMaterial, [3.98, -0.25, 0]);

        const TABLE_TOP = 0.56;
        const domaLength = 4;
        const domaWidth = 1.5;
        const domaThickness = 0.16;
        const domaStartScale = 0.9;
        const doma = new THREE.Group();
        doma.position.set(workOffset.x, TABLE_TOP + domaThickness / 2, 1.28 + workOffset.z);
        doma.scale.set(domaStartScale, 1, domaStartScale);
        scene.add(doma);

        function roundedRectangle(width, height, radius) {
          const halfWidth = width / 2;
          const halfHeight = height / 2;
          const shape = new THREE.Shape();
          shape.moveTo(-halfWidth + radius, -halfHeight);
          shape.lineTo(halfWidth - radius, -halfHeight);
          shape.quadraticCurveTo(halfWidth, -halfHeight, halfWidth, -halfHeight + radius);
          shape.lineTo(halfWidth, halfHeight - radius);
          shape.quadraticCurveTo(halfWidth, halfHeight, halfWidth - radius, halfHeight);
          shape.lineTo(-halfWidth + radius, halfHeight);
          shape.quadraticCurveTo(-halfWidth, halfHeight, -halfWidth, halfHeight - radius);
          shape.lineTo(-halfWidth, -halfHeight + radius);
          shape.quadraticCurveTo(-halfWidth, -halfHeight, -halfWidth + radius, -halfHeight);
          return shape;
        }

        let woodSeed = 39271;
        function woodRandom() {
          woodSeed = (woodSeed * 16807) % 2147483647;
          return (woodSeed - 1) / 2147483646;
        }

        function makeWoodTexture() {
          const canvas = document.createElement("canvas");
          canvas.width = 1024;
          canvas.height = 512;
          const context = canvas.getContext("2d");
          if (!context) throw new Error("Could not create the cutting board texture.");

          const base = context.createLinearGradient(0, 0, 0, canvas.height);
          base.addColorStop(0, "#81765f");
          base.addColorStop(0.48, "#766e5d");
          base.addColorStop(1, "#6b6455");
          context.fillStyle = base;
          context.fillRect(0, 0, canvas.width, canvas.height);

          for (let index = 0; index < 270; index += 1) {
            const y = woodRandom() * canvas.height;
            const phase = woodRandom() * Math.PI * 2;
            const amplitude = 1.5 + woodRandom() * 4;
            const frequency = 0.002 + woodRandom() * 0.012;
            const darkGrain = woodRandom() > 0.48;
            const alpha = darkGrain ? 0.11 + woodRandom() * 0.14 : 0.06 + woodRandom() * 0.1;
            context.strokeStyle = darkGrain
              ? `rgba(43, 34, 24, ${alpha})`
              : `rgba(195, 180, 151, ${alpha})`;
            context.lineWidth = 0.8 + woodRandom() * 1.4;
            context.beginPath();
            for (let x = 0; x <= canvas.width; x += 16) {
              const wave = Math.sin(x * frequency + phase) * amplitude
                + Math.sin(x * frequency * 0.29 + phase * 1.6) * amplitude * 0.62;
              context.lineTo(x, y + wave);
            }
            context.stroke();
          }

          for (let index = 0; index < 6; index += 1) {
            const x = 110 + woodRandom() * (canvas.width - 220);
            const y = 55 + woodRandom() * (canvas.height - 110);
            const angle = (woodRandom() - 0.5) * 0.08;
            const radiusX = 12 + woodRandom() * 12;
            const radiusY = 3 + woodRandom() * 2.5;
            context.save();
            context.translate(x, y);
            context.rotate(angle);
            for (let ring = 0; ring < 6; ring += 1) {
              context.beginPath();
              context.ellipse(0, 0, radiusX + ring * 4, radiusY + ring * 1.6, 0, 0, Math.PI * 2);
              context.strokeStyle = `rgba(42, 33, 24, ${0.34 - ring * 0.035})`;
              context.lineWidth = 1.2 + (ring === 0 ? 0.8 : 0);
              context.stroke();
            }
            context.beginPath();
            context.ellipse(0, 0, radiusX * 0.45, radiusY * 0.55, 0, 0, Math.PI * 2);
            context.fillStyle = "rgba(42, 33, 24, 0.24)";
            context.fill();
            context.restore();
          }

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          return texture;
        }

        const woodTexture = makeWoodTexture();
        const domaMaterial = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          map: woodTexture,
          bumpMap: woodTexture,
          bumpScale: 0.022,
          roughness: 0.98,
          metalness: 0
        });
        const domaShape = roundedRectangle(domaLength, domaWidth, 0.05);
        const domaGeometry = new THREE.ExtrudeGeometry(domaShape, {
          depth: domaThickness,
          bevelEnabled: false,
          steps: 1,
          curveSegments: 6
        });
        domaGeometry.translate(0, 0, -domaThickness / 2);
        const domaBoard = new THREE.Mesh(domaGeometry, domaMaterial);
        domaBoard.rotation.x = -Math.PI / 2;
        domaBoard.castShadow = false;
        domaBoard.receiveShadow = true;
        doma.add(domaBoard);

        const domaTopGeometry = new THREE.ShapeGeometry(domaShape, 6);
        const domaTopPositions = domaTopGeometry.attributes.position;
        const domaTopUvs = [];
        for (let index = 0; index < domaTopPositions.count; index += 1) {
          domaTopUvs.push(
            (domaTopPositions.getX(index) + domaLength / 2) / domaLength,
            (domaTopPositions.getY(index) + domaWidth / 2) / domaWidth
          );
        }
        domaTopGeometry.setAttribute("uv", new THREE.Float32BufferAttribute(domaTopUvs, 2));
        const domaTop = new THREE.Mesh(domaTopGeometry, domaMaterial);
        domaTop.rotation.x = -Math.PI / 2;
        domaTop.position.y = domaThickness / 2 + 0.0005;
        domaTop.receiveShadow = true;
        doma.add(domaTop);

        const bambooLength = 3.5;
        const bambooRadius = 0.044;
        const bambooRestY = TABLE_TOP + domaThickness + 0.0005 + bambooRadius;
        const bamboo = new THREE.Group();
        bamboo.position.set(workOffset.x, bambooRestY, 1.28 + workOffset.z);
        scene.add(bamboo);

        const bambooBodyMaterial = new THREE.MeshStandardMaterial({
          color: 0xc69b69,
          roughness: 0.52,
          metalness: 0.02
        });
        const bambooNodeMaterial = new THREE.MeshStandardMaterial({
          color: 0x85663e,
          roughness: 0.62,
          metalness: 0.02
        });
        const cutFaceMaterial = new THREE.MeshStandardMaterial({
          color: 0xc5ad78,
          roughness: 0.78,
          metalness: 0
        });
        const up = new THREE.Vector3(0, 1, 0);
        const xAxis = new THREE.Vector3(1, 0, 0);
        const bodyAxis = new THREE.Quaternion().setFromUnitVectors(up, xAxis);
        const initialStart = -bambooLength / 2;
        const initialEnd = bambooLength / 2;
        let currentStart = initialStart;
        let currentEnd = initialEnd;
        const bambooCurve = new THREE.LineCurve3(
          new THREE.Vector3(initialStart, 0, 0),
          new THREE.Vector3(initialEnd, 0, 0)
        );
        const bambooBody = new THREE.Mesh(
          new THREE.TubeGeometry(bambooCurve, 64, bambooRadius, 16, false),
          bambooBodyMaterial
        );
        bambooBody.castShadow = true;
        bambooBody.receiveShadow = true;
        bamboo.add(bambooBody);

        const bambooSurfaceDetails = [];
        const bambooNodePositions = [0.06, 0.25, 0.5, 0.75, 0.94];
        for (const t of bambooNodePositions) {
          const node = new THREE.Mesh(
            new THREE.TorusGeometry(bambooRadius, 0.004, 8, 24),
            bambooNodeMaterial
          );
          node.position.copy(bambooCurve.getPointAt(t));
          node.quaternion.setFromUnitVectors(
            new THREE.Vector3(0, 0, 1),
            bambooCurve.getTangentAt(t).normalize()
          );
          bamboo.add(node);
          bambooSurfaceDetails.push({ mesh: node, x: node.position.x });
        }

        const bambooEnds = [];
        for (const x of [initialStart, initialEnd]) {
          const end = new THREE.Mesh(
            new THREE.SphereGeometry(bambooRadius, 16, 12),
            bambooBodyMaterial
          );
          end.position.x = x;
          end.castShadow = true;
          bamboo.add(end);
          bambooEnds.push(end);
        }

        const knifeScale = 0.55;
        const knifeHandleLength = 1.05;
        const knifeHandleWidth = 0.35;
        const knifeHandleThickness = 0.14;
        const knifeHandleBevel = 0.018;
        const knifeBladeLength = 1.3;
        const knifeBladeWidth = 0.25;
        const knifeBladeThickness = 0.04;
        const knifeBladeBevel = 0.006;
        const knifeOverlap = 0.045;
        const knifeTotalLength = knifeHandleLength + knifeBladeLength - knifeOverlap;
        let knifeSeed = 85431;
        function knifeRandom() {
          knifeSeed = (knifeSeed * 16807) % 2147483647;
          return (knifeSeed - 1) / 2147483646;
        }

        function makeKnifeHandleTexture() {
          const canvas = document.createElement("canvas");
          canvas.width = 512;
          canvas.height = 256;
          const context = canvas.getContext("2d");
          if (!context) throw new Error("Could not create the knife handle texture.");
          context.fillStyle = "#535b5f";
          context.fillRect(0, 0, canvas.width, canvas.height);

          for (let index = 0; index < 1700; index += 1) {
            const shade = knifeRandom() > 0.56 ? 17 : 139;
            const alpha = shade < 40 ? 0.08 + knifeRandom() * 0.12 : 0.035 + knifeRandom() * 0.08;
            context.fillStyle = `rgba(${shade - 2}, ${shade}, ${shade + 3}, ${alpha})`;
            const x = knifeRandom() * canvas.width;
            const y = knifeRandom() * canvas.height;
            context.beginPath();
            context.ellipse(
              x,
              y,
              0.5 + knifeRandom() * 2.4,
              0.45 + knifeRandom() * 1.5,
              (knifeRandom() - 0.5) * 0.9,
              0,
              Math.PI * 2
            );
            context.fill();
          }

          for (let index = 0; index < 120; index += 1) {
            const x = knifeRandom() * canvas.width;
            const y = knifeRandom() * canvas.height;
            const length = 2 + knifeRandom() * 16;
            const shade = knifeRandom() > 0.5 ? 18 : 172;
            context.strokeStyle = `rgba(${shade - 2}, ${shade}, ${shade + 4}, ${0.035 + knifeRandom() * 0.08})`;
            context.lineWidth = 0.5 + knifeRandom() * 1.2;
            context.beginPath();
            context.moveTo(x, y);
            context.lineTo(x + length, y + (knifeRandom() - 0.5) * 2);
            context.stroke();
          }

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.repeat.set(2, 1.2);
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          return texture;
        }

        function makeKnifeBladeTexture() {
          const canvas = document.createElement("canvas");
          canvas.width = 512;
          canvas.height = 256;
          const context = canvas.getContext("2d");
          if (!context) throw new Error("Could not create the knife blade texture.");
          context.fillStyle = "#abb4b8";
          context.fillRect(0, 0, canvas.width, canvas.height);
          for (let index = 0; index < 150; index += 1) {
            const y = knifeRandom() * canvas.height;
            const shade = knifeRandom() > 0.5 ? 57 : 224;
            context.strokeStyle = `rgba(${shade - 2}, ${shade}, ${shade + 4}, ${0.04 + knifeRandom() * 0.09})`;
            context.lineWidth = 0.4 + knifeRandom() * 1.2;
            context.beginPath();
            context.moveTo(0, y);
            context.lineTo(canvas.width, y + (knifeRandom() - 0.5) * 1.2);
            context.stroke();
          }
          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          return texture;
        }

        const knifeHandleMaterial = new THREE.MeshStandardMaterial({
          color: 0xcbd1d4,
          map: makeKnifeHandleTexture(),
          bumpScale: 0.005,
          roughness: 0.5,
          metalness: 0.38
        });
        knifeHandleMaterial.bumpMap = knifeHandleMaterial.map;
        const knifeBladeMaterial = new THREE.MeshStandardMaterial({
          color: 0xf0f3f5,
          map: makeKnifeBladeTexture(),
          bumpScale: 0.0015,
          roughness: 0.32,
          metalness: 0.48
        });
        knifeBladeMaterial.bumpMap = knifeBladeMaterial.map;

        function makeKnifeSlab(length, width, thickness, radius, bevel, material) {
          const geometry = new THREE.ExtrudeGeometry(roundedRectangle(length, width, radius), {
            depth: thickness,
            bevelEnabled: true,
            bevelSegments: 2,
            steps: 1,
            bevelSize: bevel,
            bevelThickness: bevel,
            curveSegments: 6
          });
          geometry.translate(0, 0, -thickness / 2);
          const mesh = new THREE.Mesh(geometry, material);
          mesh.rotation.x = -Math.PI / 2;
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          return mesh;
        }

        const knife = new THREE.Group();
        const knifeHandleRight = -knifeTotalLength / 2 + knifeHandleLength;
        const knifeBladeCenterX = knifeHandleRight - knifeOverlap + knifeBladeLength / 2;
        const knifeHandle = makeKnifeSlab(
          knifeHandleLength,
          knifeHandleWidth,
          knifeHandleThickness,
          0.07,
          knifeHandleBevel,
          knifeHandleMaterial
        );
        knifeHandle.position.x = -knifeTotalLength / 2 + knifeHandleLength / 2;
        knife.add(knifeHandle);

        const knifeBlade = makeKnifeSlab(
          knifeBladeLength,
          knifeBladeWidth,
          knifeBladeThickness,
          0.045,
          knifeBladeBevel,
          knifeBladeMaterial
        );
        knifeBlade.position.set(
          knifeBladeCenterX,
          -(knifeHandleThickness - knifeBladeThickness) / 2 - knifeHandleBevel + knifeBladeBevel,
          0
        );
        knife.add(knifeBlade);

        knife.scale.setScalar(knifeScale);
        const knifeDirection = new THREE.Vector3(0.55, -0.4, 0.73).normalize();
        const knifeFaceNormal = new THREE.Vector3(3, 0.42, 0.22).normalize();
        knifeFaceNormal.addScaledVector(
          knifeDirection,
          -knifeFaceNormal.dot(knifeDirection)
        ).normalize();
        const knifeSide = new THREE.Vector3()
          .crossVectors(knifeDirection, knifeFaceNormal)
          .normalize();
        knife.quaternion.setFromRotationMatrix(
          new THREE.Matrix4().makeBasis(knifeDirection, knifeFaceNormal, knifeSide)
        );
        const knifeContact = new THREE.Vector3(
          bamboo.position.x + bambooLength / 2 - bambooLength / 12,
          bambooRestY + bambooRadius,
          bamboo.position.z
        );
        knife.position.copy(knifeContact)
          .addScaledVector(knifeDirection, -knifeTotalLength / 2 * knifeScale)
          .addScaledVector(
            knifeSide,
            (knifeBladeWidth / 2 + knifeBladeBevel) * knifeScale
          )
          .addScaledVector(
            knifeFaceNormal,
            (knifeHandleThickness / 2 + knifeHandleBevel) * knifeScale
          );
        scene.add(knife);

        const cutLength = bambooLength / 12;
        const cutPositions = [-bambooLength / 2 + cutLength, bambooLength / 2 - cutLength];
        const cutMarkers = [];
        const cutCaps = [];
        const hitTargetMaterial = new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0,
          colorWrite: false,
          depthWrite: false
        });
        const cutAxis = bodyAxis.clone();

        for (let index = 0; index < cutPositions.length; index += 1) {
          const marker = new THREE.Group();
          marker.position.x = cutPositions[index];
          marker.userData.markerIndex = index;
          marker.userData.side = index === 0 ? "left" : "right";
          marker.userData.cut = false;
          marker.userData.materials = [];
          bamboo.add(marker);
          cutMarkers.push(marker);

          const dotMaterial = new THREE.MeshStandardMaterial({
            color: 0xe7bd72,
            emissive: 0x6a3b12,
            emissiveIntensity: 0.4,
            roughness: 0.42,
            metalness: 0.06
          });
          marker.userData.materials.push(dotMaterial);

          const dotCount = 12;
          for (let dotIndex = 0; dotIndex < dotCount; dotIndex += 1) {
            const angle = dotIndex / dotCount * Math.PI * 2;
            const dot = new THREE.Mesh(new THREE.SphereGeometry(0.011, 10, 8), dotMaterial);
            dot.position.set(0, Math.cos(angle) * 0.06, Math.sin(angle) * 0.06);
            dot.userData.markerIndex = index;
            dot.castShadow = true;
            marker.add(dot);
          }

          const hitTarget = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.2, 0.22, 12),
            hitTargetMaterial
          );
          hitTarget.quaternion.copy(cutAxis);
          hitTarget.userData.markerIndex = index;
          marker.add(hitTarget);

          const cap = new THREE.Mesh(
            new THREE.CylinderGeometry(0.044, 0.044, 0.018, 24),
            cutFaceMaterial.clone()
          );
          cap.quaternion.copy(cutAxis);
          cap.visible = false;
          bamboo.add(cap);
          cutCaps.push(cap);
        }

        function setBambooRange(start, end) {
          bambooBody.geometry.dispose();
          bambooBody.geometry = new THREE.TubeGeometry(
            new THREE.LineCurve3(
              new THREE.Vector3(start, 0, 0),
              new THREE.Vector3(end, 0, 0)
            ),
            64,
            bambooRadius,
            16,
            false
          );
          for (const detail of bambooSurfaceDetails) {
            detail.mesh.visible = detail.x >= start && detail.x <= end;
          }
          currentStart = start;
          currentEnd = end;
        }

        const cameraStartPosition = new THREE.Vector3(0, 6.75, 10.8);
        const cameraStartTarget = new THREE.Vector3(0, 1.05, 0);
        const cameraFocusTarget = new THREE.Vector3(
          bamboo.position.x + cutPositions[1] - workOffset.x,
          bambooRestY,
          bamboo.position.z - workOffset.z
        );
        const cameraFocusPosition = cameraFocusTarget.clone().add(new THREE.Vector3(3, 0.42, 0.22));
        const cameraTarget = cameraStartTarget.clone();
        camera.position.copy(cameraStartPosition);
        camera.lookAt(cameraTarget);

        function resize() {
          const width = Math.max(1, host.clientWidth);
          const height = Math.max(1, host.clientHeight);
          camera.aspect = width / height;
          camera.lookAt(cameraTarget);
          camera.updateProjectionMatrix();
          renderer.setSize(width, height, false);
        }

        let cutCount = 0;
        let phase = "intro";
        let hoveredMarker = null;
        let toastTimer = 0;
        const introStartedAt = performance.now();

        function easeInOut(value) {
          const progress = THREE.MathUtils.clamp(value, 0, 1);
          return progress * progress * (3 - 2 * progress);
        }

        function updateIntro(timestamp) {
          const elapsed = (timestamp - introStartedAt) / 1000;
          const cameraProgress = easeInOut(elapsed / 1.4);
          camera.position.lerpVectors(cameraStartPosition, cameraFocusPosition, cameraProgress);
          cameraTarget.lerpVectors(cameraStartTarget, cameraFocusTarget, cameraProgress);
          camera.lookAt(cameraTarget);

          const boardProgress = easeInOut((elapsed - 0.2) / 0.9);
          const boardScale = THREE.MathUtils.lerp(domaStartScale, 1, boardProgress);
          doma.scale.set(boardScale, 1, boardScale);

          if (elapsed >= 2.15) {
            doma.scale.set(1, 1, 1);
            camera.position.copy(cameraFocusPosition);
            cameraTarget.copy(cameraFocusTarget);
            camera.lookAt(cameraTarget);
            phase = "playing";
            instruction.textContent = "대나무 양쪽의 점선을 차례로 클릭하세요.";
            updateProgress();
            renderer.domElement.style.cursor = "default";
          }
        }

        function updateProgress() {
          const percent = cutCount / cutMarkers.length * 100;
          cutCountLabel.innerHTML = `${cutCount}<small> / ${cutMarkers.length}</small>`;
          progressFill.style.width = `${percent}%`;
          progressTrack.setAttribute("aria-valuenow", String(cutCount));
          if (cutCount === 0) {
            progressHint.textContent = "좌우 점선을 클릭해 양 끝을 잘라주세요";
            progressState.textContent = "재단 준비";
          } else if (cutCount < cutMarkers.length) {
            progressHint.textContent = "한쪽을 잘랐어요. 반대쪽 점선도 클릭하세요";
            progressState.textContent = "재단 중";
          } else {
            progressHint.textContent = "양쪽 재단을 마쳤습니다";
            progressState.textContent = "완료";
          }
        }

        function updatePointer(event) {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          camera.updateMatrixWorld(true);
          scene.updateMatrixWorld(true);
          raycaster.setFromCamera(pointer, camera);
        }

        function findMarkerAtPointer() {
          if (phase !== "playing") return null;
          const available = cutMarkers.filter((marker) => marker.visible && !marker.userData.cut);
          if (available.length === 0) return null;
          const intersections = raycaster.intersectObjects(available, true);
          if (intersections.length === 0) return null;
          const markerIndex = intersections[0].object.userData.markerIndex;
          return Number.isInteger(markerIndex) ? cutMarkers[markerIndex] : null;
        }

        function updateHover(marker) {
          if (hoveredMarker === marker) return;
          hoveredMarker = marker;
          for (const currentMarker of cutMarkers) {
            const active = currentMarker === hoveredMarker && !currentMarker.userData.cut;
            for (const material of currentMarker.userData.materials) {
              material.emissive.setHex(active ? 0xb36a24 : 0x6a3b12);
              material.emissiveIntensity = active ? 0.8 : 0.4;
            }
            for (const dot of currentMarker.children) {
              if (dot.isMesh && dot.geometry.type === "SphereGeometry") {
                dot.scale.setScalar(active ? 1.4 : 1);
              }
            }
          }
          renderer.domElement.style.cursor = hoveredMarker ? "pointer" : "default";
        }

        function showToast(message) {
          toast.textContent = message;
          toast.classList.add("is-visible");
          window.clearTimeout(toastTimer);
          toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2400);
        }

        function cutBamboo(marker) {
          if (phase !== "playing" || !marker || marker.userData.cut) return;
          const isLeft = marker.userData.side === "left";
          const cutX = marker.position.x;
          setBambooRange(isLeft ? cutX : currentStart, isLeft ? currentEnd : cutX);

          bambooEnds[isLeft ? 0 : 1].visible = false;
          const cap = cutCaps[marker.userData.markerIndex];
          cap.position.set(cutX, 0, 0);
          cap.visible = true;

          marker.userData.cut = true;
          marker.visible = false;
          cutCount += 1;
          updateProgress();
          updateHover(null);

          if (cutCount === cutMarkers.length) {
            phase = "complete";
            instruction.textContent = "대나무 양쪽을 모두 재단했습니다.";
            document.getElementById("complete-screen").classList.add("is-visible");
          } else {
            const sideText = isLeft ? "왼쪽" : "오른쪽";
            instruction.textContent = `${sideText} 끝을 잘랐어요. 반대쪽 점선을 클릭하세요.`;
          }
        }

        function resetStage() {
          phase = "playing";
          cutCount = 0;
          hoveredMarker = null;
          setBambooRange(initialStart, initialEnd);
          for (const end of bambooEnds) end.visible = true;
          for (const marker of cutMarkers) {
            marker.visible = true;
            marker.userData.cut = false;
            marker.userData.materials[0].emissive.setHex(0x6a3b12);
            marker.userData.materials[0].emissiveIntensity = 0.4;
            for (const dot of marker.children) {
              if (dot.isMesh && dot.geometry.type === "SphereGeometry") {
                dot.scale.setScalar(1);
              }
            }
          }
          for (const cap of cutCaps) cap.visible = false;
          document.getElementById("complete-screen").classList.remove("is-visible");
          instruction.textContent = "대나무 양쪽의 점선을 차례로 클릭하세요.";
          updateProgress();
          renderer.domElement.style.cursor = "default";
          toast.classList.remove("is-visible");
        }

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const clock = new THREE.Clock();

        renderer.domElement.addEventListener("pointermove", (event) => {
          updatePointer(event);
          updateHover(findMarkerAtPointer());
        });

        renderer.domElement.addEventListener("pointerleave", () => updateHover(null));

        renderer.domElement.addEventListener("pointerdown", (event) => {
          if (phase !== "playing") return;
          updatePointer(event);
          cutBamboo(findMarkerAtPointer());
          event.preventDefault();
        });

        document.getElementById("retry-button").addEventListener("click", resetStage);
        document.getElementById("next-button").addEventListener("click", () => {
          window.location.href = "stage4.html";
        });

        window.addEventListener("resize", resize);
        resize();
        updateProgress();
        instruction.textContent = "도마를 준비하고 있습니다.";
        progressHint.textContent = "도마가 놓인 뒤 재단을 시작하세요";
        progressState.textContent = "준비 중";
        renderer.setAnimationLoop((timestamp) => {
          if (phase === "intro") updateIntro(timestamp);
          renderer.render(scene, camera);
        });
        announceStageReady();
      })();
    }).catch((error) => {
      console.error("Three.js failed to load; the cutting stage could not start.", error);
      errorScreen.classList.add("is-visible");
      announceStageReady();
    });
  </script>
</body>
</html>
